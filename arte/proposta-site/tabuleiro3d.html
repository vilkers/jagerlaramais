9.3,339.5 272.8,349.0 256.4,339.5 256.4,320.5"},{"c":8,"r":10,"tipo":"rota","pts":"305.7,311.0 322.2,320.5 322.2,339.5 305.7,349.0 289.3,339.5 289.3,320.5"},{"c":9,"r":10,"tipo":"rota","pts":"338.6,311.0 355.1,320.5 355.1,339.5 338.6,349.0 322.2,339.5 322.2,320.5"},{"c":10,"r":10,"tipo":"campo","pts":"371.5,311.0 388.0,320.5 388.0,339.5 371.5,349.0 355.1,339.5 355.1,320.5"}],"torres":[{"pos":[0,8],"t":0,"vida":20,"max":20},{"pos":[0,4],"t":0,"vida":20,"max":20},{"pos":[7,0],"t":1,"vida":20,"max":20},{"pos":[3,0],"t":1,"vida":13,"max":20},{"pos":[2,9],"t":0,"vida":20,"max":20},{"pos":[3,7],"t":0,"vida":20,"max":20},{"pos":[7,1],"t":1,"vida":20,"max":20},{"pos":[6,3],"t":1,"vida":20,"max":20},{"pos":[3,10],"t":0,"vida":20,"max":20},{"pos":[7,10],"t":0,"vida":20,"max":20},{"pos":[10,2],"t":1,"vida":20,"max":20},{"pos":[10,6],"t":1,"vida":20,"max":20}],"camps":[{"pos":[3,4],"dono":0},{"pos":[7,6],"dono":1},{"pos":[3,3],"dono":-1}],"pecas":[{"pos":[2,1],"t":0,"n":"O Taxista","id":"vharn","vida":7,"max":25},{"pos":[2,3],"t":0,"n":"Pombo Ciborgue","id":"nyx","vida":18,"max":18},{"pos":[0,10],"t":0,"n":"Parab\u00f3lica Diab\u00f3lica","id":"solenne","vida":18,"max":18},{"pos":[3,7],"t":0,"n":"Z\u00e9 Griteco","id":"vesper","vida":20,"max":20},{"pos":[3,10],"t":0,"n":"Emerson Emo","id":"mirrha","vida":20,"max":20},{"pos":[1,1],"t":1,"n":"Dona Chinela","id":"kaross","vida":15,"max":22},{"pos":[3,2],"t":1,"n":"Grumo","id":"grumo","vida":23,"max":23},{"pos":[6,2],"t":1,"n":"Zhet","id":"zhet","vida":18,"max":18},{"pos":[7,4],"t":1,"n":"Cael","id":"cael","vida":16,"max":18},{"pos":[10,2],"t":1,"n":"Torvald","id":"torvald","vida":22,"max":22}],"poco":[8,8],"rodada":8,"nexus":[3,3]};

/* ═══ A PROJEÇÃO ═══
   Isométrico de verdade seria matriz 3D e câmera. Para um tabuleiro que nunca
   gira, basta ACHATAR o eixo Y e subtrair a altura: `Y = y*INCLINA - z*ALTURA`.
   É a mesma conta de um diorama fotografado de cima, e cabe em uma linha.

   O ganho de fazer assim em vez de WebGL: continua SVG, continua sem
   dependência, continua clicável por hit-test do próprio navegador — e o
   motor não muda nem uma linha, porque a coordenada do jogo continua (c,r). */
const INCLINA = 0.56;      // o quanto o tabuleiro deita para trás
const ALTURA  = 13;        // pixels por unidade de elevação
const LAJE    = 9.5;       // espessura da laje — massa de maquete, não adesivo

/* elevação por terreno — é ela que faz o tabuleiro virar maquete em vez de
   mapa pintado. Rota afunda (asfalto gasto), mato sobe (vegetação), casa
   bloqueada sobe muito (ônibus, caixa d'água), e o poço AFUNDA: ele é um poço. */
const ELEV = { rota:-0.18, campo:0, mato:.62, bloqueado:1.25, base0:.95, base1:.95, poco:-.7 };
const COR  = { rota:"#A89478", campo:"#CFC3AE", mato:"#7FA65C", bloqueado:"#8A7452",
               base0:"#A9B6C4", base1:"#C4A9A9", poco:"#5F6D5C" };

const escurece = (hex, f) => {
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*f), g2 = Math.round(((n>>8)&255)*f), b = Math.round((n&255)*f);
  return `rgb(${r},${g2},${b})`;
};
const pontos = s => s.trim().split(/\s+/).map(p => p.split(",").map(Number));
const proj = (x,y,z) => [x, y*INCLINA - z*ALTURA];

const vb = D.viewBox.split(" ").map(Number);
const cx = vb[0]+vb[2]/2, cy = vb[1]+vb[3]/2;

/* ordem de pintura: de trás para a frente. Sem isso a casa do fundo desenha por
   cima da da frente e a maquete vira colagem. */
const cels = D.cels.slice().sort((a,b)=>{
  const ya = pontos(a.pts).reduce((s,p)=>s+p[1],0)/6;
  const yb = pontos(b.pts).reduce((s,p)=>s+p[1],0)/6;
  return ya-yb;
});

const achaCel = (c,r) => D.cels.find(x=>x.c===c&&x.r===r);
const centroDe = cel => { const ps = pontos(cel.pts);
  return [ps.reduce((s,p)=>s+p[0],0)/6, ps.reduce((s,p)=>s+p[1],0)/6]; };

let out = "";
for (const cel of cels) {
  const z = ELEV[cel.tipo] ?? 0;
  const base = COR[cel.tipo] || COR.campo;
  const ps = pontos(cel.pts);
  const topo = ps.map(p => proj(p[0],p[1],z));
  const cy2 = topo.reduce((s,p)=>s+p[1],0)/6;

  /* AS LATERAIS. Só as arestas da metade de baixo aparecem — as de cima ficam
     escondidas atrás da própria laje. Testar pelo ponto médio é genérico: não
     depende da ordem em que os cantos foram escritos. */
  for (let i=0;i<6;i++){
    const a = topo[i], b = topo[(i+1)%6];
    if ((a[1]+b[1])/2 < cy2 - .3) continue;
    const face = `${a[0]},${a[1]} ${b[0]},${b[1]} ${b[0]},${b[1]+LAJE} ${a[0]},${a[1]+LAJE}`;
    /* duas tonalidades: a luz vem de cima e da esquerda */
    const f = a[0] < b[0] ? .70 : .58;
    out += `<polygon points="${face}" fill="${escurece(base,f)}" stroke="${escurece(base,.5)}" stroke-width=".35"/>`;
  }
  out += `<polygon points="${topo.map(p=>p.join(",")).join(" ")}" fill="${base}"
           stroke="#5A5142" stroke-width=".55" stroke-linejoin="round"/>`;

  /* FAIXA DE ASFALTO. Sem ela a rota vira só uma casa de outra cor; com ela o
     olho segue o caminho de uma torre à outra, que é como se lê o tabuleiro. */
  if (cel.tipo==="rota"){
    const [ccx,ccy] = centroDe(cel); const [px,py] = proj(ccx,ccy,z);
    out += `<ellipse cx="${px}" cy="${py}" rx="11" ry="5.4" fill="#8E7C62" opacity=".55"/>`;
    out += `<path d="M${px-7},${py} h4 M${px-1},${py} h4 M${px+5},${py} h3"
             stroke="#E8DCC0" stroke-width="1.1" opacity=".5" stroke-linecap="round"/>`;
  }

  /* o poço ganha o brilho do épico lá no fundo */
  if (cel.tipo==="poco"){
    const [ccx,ccy] = centroDe(cel); const [px,py] = proj(ccx,ccy,z);
    out += `<ellipse cx="${px}" cy="${py}" rx="9" ry="5" fill="#7FA65C" opacity=".55"/>`;
    out += `<ellipse cx="${px}" cy="${py}" rx="5" ry="2.8" fill="#C6F53F" opacity=".65"/>`;
  }
}

/* ═══ O QUE FICA EM CIMA ═══ tudo com sombra no chão, senão flutua */
const emCima = [];
D.camps.forEach(k=>{ const cel=achaCel(...k.pos); if(cel) emCima.push({cel,tipo:"camp",d:k}); });
D.torres.filter(t=>t.vida>0).forEach(t=>{ const cel=achaCel(...t.pos); if(cel) emCima.push({cel,tipo:"torre",d:t}); });
D.pecas.forEach(p=>{ const cel=achaCel(...p.pos); if(cel) emCima.push({cel,tipo:"peca",d:p}); });
emCima.sort((a,b)=>centroDe(a.cel)[1]-centroDe(b.cel)[1]);

const AZUL="#3B6C90", CARMIM="#8F3E36";
for (const it of emCima){
  const z = ELEV[it.cel.tipo] ?? 0;
  const [ccx,ccy] = centroDe(it.cel);
  const [px,py] = proj(ccx,ccy,z);
  out += `<ellipse cx="${px}" cy="${py+1.5}" rx="7" ry="3.4" fill="#000" opacity=".22"/>`;

  if (it.tipo==="camp"){
    out += `<ellipse cx="${px}" cy="${py-3}" rx="6" ry="3" fill="#D4A24C" stroke="#6B5316" stroke-width=".6"/>
            <ellipse cx="${px}" cy="${py-4.6}" rx="6" ry="3" fill="#E8C878" stroke="#6B5316" stroke-width=".6"/>`;
  }
  if (it.tipo==="torre"){
    const cor = it.d.t ? CARMIM : AZUL;
    const h = 17, frac = it.d.vida/it.d.max;
    /* base larga + corpo curto + ameia. A peça é redonda e fina; a torre é
       quadrada e pesada — dá para separar as duas de relance, que era o
       problema da primeira versão. */
    out += `<ellipse cx="${px}" cy="${py}" rx="10" ry="4.8" fill="${escurece(cor,.5)}" stroke="#2A2A28" stroke-width=".5"/>
            <path d="M${px-7.5},${py-2} L${px-5.5},${py-h} L${px+5.5},${py-h} L${px+7.5},${py-2} Z"
             fill="${cor}" stroke="#2A2A28" stroke-width=".6"/>
            <path d="M${px-5.5},${py-h} L${px-5.5},${py-h-4} L${px-2},${py-h-4} L${px-2},${py-h-1.5}
                     L${px+2},${py-h-1.5} L${px+2},${py-h-4} L${px+5.5},${py-h-4} L${px+5.5},${py-h} Z"
             fill="${escurece(cor,1.3)}" stroke="#2A2A28" stroke-width=".5"/>
            <rect x="${px-7.5}" y="${py+3}" width="15" height="2.6" fill="#00000035" rx="1"/>
            <rect x="${px-7.5}" y="${py+3}" width="${15*frac}" height="2.6" fill="${cor}" rx="1"/>`;
  }
  if (it.tipo==="peca"){
    const cor = it.d.t ? CARMIM : AZUL;
    const h = 13;
    out += `<path d="M${px},${py} L${px},${py-h}" stroke="${escurece(cor,.55)}" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="${px}" cy="${py-h-4}" r="5.6" fill="${cor}" stroke="#EDEBE2" stroke-width="1.5"/>
            <circle cx="${px}" cy="${py-h-4}" r="5.6" fill="none" stroke="#2A2A28" stroke-width=".5"/>`;
  }
}

/* o viewBox tem de crescer: a projeção achata em Y mas a elevação empurra para cima */
const X0 = vb[0]-14, LARG = vb[2]+28;
const Y0 = (vb[1])*INCLINA - ALTURA*1.6 - 22, ALT = vb[3]*INCLINA + ALTURA*2.4 + 52;
document.querySelector("#palco").innerHTML =
  `<svg viewBox="${X0} ${Y0} ${LARG} ${ALT}">
     <defs><filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
       <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3A3226" flood-opacity=".28"/>
     </filter></defs>
     <ellipse cx="${vb[0]+vb[2]/2}" cy="${(vb[1]+vb[3])*INCLINA + 16}"
              rx="${vb[2]*.54}" ry="${vb[3]*INCLINA*.30}" fill="#3A3226" opacity=".16"/>
     <g filter="url(#sombra)">${out}</g>
   </svg>`;
document.querySelector("#rod").textContent = D.rodada;
</script>
