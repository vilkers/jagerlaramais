/* ═══════════ O QUE ESTA IMAGEM É, E O QUE ELA NÃO É ═══════════
   A referência é terreno modular de mesa: cada hexágono é uma PASTILHA física
   separada, com parede lateral, altura própria e um vão escuro entre ela e a
   vizinha. Não é o isométrico chapado que eu tinha feito antes — lá tudo estava
   no mesmo plano, e era exatamente por isso que parecia comum.

   Três coisas fazem a leitura de peça física, e as três estão aqui:
     · ESPESSURA — a pastilha tem parede, e a parede pega sombra
     · DEGRAU    — terrenos em alturas diferentes, com sombra caindo no vizinho
     · VÃO       — a peça é encolhida, e o preto entre elas é o que diz "solta"

   É DESENHO, não render. Sem oclusão real, sem luz volumétrica, sem textura
   fotográfica — isso é ilustração vetorial escrita à mão. Serve para decidir se
   o CAMINHO é esse. Se for, o caminho de produção é outro (protótipo impresso
   e fotografado, ou motor 3D de verdade).

   A geometria é a REAL do jogo: mesmas 116 casas, mesmas rotas, mesmas torres. */

const P={
  areia:"#C6A97A", areiaEsc:"#8E7649",
  mato:"#55764F",  matoEsc:"#33472F",
  ferro:"#9A7550", ferroEsc:"#63482E",

  tinta:"#17140F", azul:"#3B8FD4", carmim:"#D2564A", latao:"#D3A93F",
};
function rnd(c,r,k){let x=Math.imul(c,374761393)^Math.imul(r,668265263)^Math.imul(k,1442695040);
  x=Math.imul(x^(x>>>15),2246822519);x=Math.imul(x^(x>>>13),3266489917);x^=x>>>16;
  return (x>>>0)/4294967296;}
const n1=v=>Math.round(v*100)/100;
const ptsDe=s=>s.trim().split(/\s+/).map(p=>p.split(",").map(Number));
const cen=(c,r)=>D.centro[c+","+r];

/* ── A CÂMERA ──
   Achatar o eixo Y é o truque inteiro: a mesma malha vista de uma altura baixa.
   ALT é quanto UM degrau sobe na tela — é ele que transforma altura em coisa
   que se enxerga. */
const ACHATA=0.56, ALT=7.5, BASE_ESP=5;
const proj=(x,y,z)=>[x, y*ACHATA - z*ALT];

/* ── A ALTURA DE CADA TERRENO ──
   Não é enfeite: é a leitura do mapa virando relevo. Água no fundo, rua no
   nível de andar, mato subindo, ferro-velho empilhado mais alto que tudo.

   A FAIXA É CURTA DE PROPÓSITO: 0 a 3. A primeira versão ia até 4, e um degrau
   de quatro níveis ao lado da água deixava de ser degrau e virava PILAR — que é
   justamente o que a referência não tem. Terreno modular de mesa empilha dois,
   três dedos, não um prédio. */
const lado=(c,r)=>{const [x,y]=cen(c,r);
  return ((430+26)*(y-64)-(368-64)*(x+26))>0?1:-1;};
function alturaDe(cel){
  const a=rnd(cel.c,cel.r,7);
  if(cel.tipo==="rota") return 1;
  if(cel.tipo==="base0"||cel.tipo==="base1") return 2;
  if(cel.tipo==="poco") return 0;
  if(cel.tipo==="mato") return 2;
  if(cel.tipo==="bloqueado") return 3;
  return 1+(a>.62?1:0);                       /* campo: quase tudo no nível da rua */
}
/* o rio do jogo: a diagonal espelhada. Aqui ele vira depressão de verdade. */
const RIO=new Set();
(()=>{const meia=[];
  for(let r=10;r>5;r--){const c=1+Math.floor(r/2); meia.push(c+","+r);}
  meia.forEach(k=>{RIO.add(k); const [c,r]=k.split(",").map(Number);
    RIO.add((10-c)+","+(10-r));});
})();

/* ── QUEM É O VIZINHO DAQUELE LADO ──
   A parede de uma pastilha não desce até o chão: ela desce até o TAMPO DA
   VIZINHA. Desenhar sempre até o chão transformava peça alta em pilar — e
   pilar não é o que a referência mostra, ela mostra DEGRAU. Só a borda do
   tabuleiro, que não tem vizinha, aparece como laje inteira. */
const _POR_POS=new Map(D.cels.map(c=>[c.c+","+c.r,c]));
const _CENTROS=D.cels.map(c=>({c,xy:cen(c.c,c.r)}));
function vizinhoNaAresta(cel,mx,my){
  const [cx,cy]=cen(cel.c,cel.r);
  const px=cx+(mx-cx)*1.7, py=cy+(my-cy)*1.7;   /* um passo para fora da aresta */
  let melhor=null,dd=1e9;
  for(const v of _CENTROS){
    if(v.c===cel)continue;
    const d=Math.hypot(v.xy[0]-px, v.xy[1]-py);
    if(d<dd){dd=d;melhor=v.c;}
  }
  return dd<14?melhor:null;                      /* longe demais = borda do tabuleiro */
}

function arvore(x,y,e,k){

  o+=`<rect x="${n1(x-.9*e)}" y="${n1(y-5*e)}" width="${n1(1.8*e)}" height="${n1(5*e)}" fill="#4A3722"/>`;
  const v=["#4E7A46","#5C8C52","#3F6639"];
  for(let i=0;i<3;i++){const w=(7-i*1.7)*e, h=(6.5-i*.9)*e, yy=y-5*e-i*3.6*e;

}

      fill="#A8853F" stroke="${P.tinta}" stroke-width=".6"/>`;
  for(let i=0;i<4;i++){const t=i/4, t2=(i+1)/4;
    o+=`<path d="M${n1(x-5+2.8*t)},${n1(y-22*t)} L${n1(x+5-2.8*t2)},${n1(y-22*t2)}
         M${n1(x+5-2.8*t)},${n1(y-22*t)} L${n1(x-5+2.8*t2)},${n1(y-22*t2)}"
        stroke="${P.tinta}" stroke-width=".5" fill="none"/>`;}
  o+=`<circle cx="${n1(x)}" cy="${n1(y-24.5)}" r="2.6" fill="${cor}" stroke="${P.tinta}" stroke-width=".6"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-24.5)}" r="5.5" fill="${cor}" opacity=".22"/>`;
  return o;
}
function nexo(x,y,cor){
  let o=`<ellipse cx="${n1(x+4)}" cy="${n1(y+2)}" rx="14" ry="5.5" fill="#000" opacity=".35"/>`;
  o+=`<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="13" ry="5.2" fill="#B9A277" stroke="${P.tinta}" stroke-width=".7"/>`;
  for(let i=0;i<5;i++){const an=i*1.2566, px=x+Math.cos(an)*10, py=y+Math.sin(an)*4;
    o+=`<rect x="${n1(px-1.4)}" y="${n1(py-5)}" width="2.8" height="5" fill="#8E7A52" stroke="${P.tinta}" stroke-width=".45"/>`;}
  o+=`<path d="M${n1(x-7)},${n1(y-2)} L${n1(x-4)},${n1(y-17)} L${n1(x+4)},${n1(y-17)} L${n1(x+7)},${n1(y-2)} Z"
      fill="#A8853F" stroke="${P.tinta}" stroke-width=".65"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-21)}" r="4.6" fill="${cor}" stroke="${P.tinta}" stroke-width=".7"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-21)}" r="2.2" fill="#F5EED6"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-21)}" r="11" fill="${cor}" opacity=".16"/>`;
  return o;
}
function boneco(x,y,cor){                    /* miniatura na base redonda */
  let o=`<ellipse cx="${n1(x+1.6)}" cy="${n1(y+1)}" rx="5.4" ry="2.2" fill="#000" opacity=".4"/>`;
  o+=`<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="4.8" ry="2" fill="#2A2620" stroke="${cor}" stroke-width=".9"/>`;
  o+=`<path d="M${n1(x-1.8)},${n1(y-1)} L${n1(x-1.2)},${n1(y-8)} L${n1(x+1.2)},${n1(y-8)} L${n1(x+1.8)},${n1(y-1)} Z"
      fill="${cor}" stroke="${P.tinta}" stroke-width=".45"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-9.6)}" r="1.9" fill="${cor}" stroke="${P.tinta}" stroke-width=".45"/>`;
  return o;
}

/* ── DESENHO: DE TRÁS PARA A FRENTE ──
   Sem z-buffer, a ordem É a profundidade. Linha por linha, de trás para a
   frente; dentro da linha, cada peça e o que está EM CIMA dela saem juntos,
   senão a árvore de uma casa aparece na frente da pastilha vizinha. */
let saida="";
const porLinha=new Map();
D.cels.forEach(cel=>{ if(!porLinha.has(cel.r))porLinha.set(cel.r,[]); porLinha.get(cel.r).push(cel); });
const linhas=[...porLinha.keys()].sort((a,b)=>a-b);

let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
const marca=(x,y)=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);};

for(const r of linhas){
  for(const cel of porLinha.get(r).sort((a,b)=>a.c-b.c)){
    const key=cel.c+","+cel.r;
    const agua=RIO.has(key);
    const z=agua?0:alturaDe(cel);
    const [cx,cy]=cen(cel.c,cel.r);
    const L=lado(cel.c,cel.r);
    /* a peça é ENCOLHIDA: o vão escuro entre pastilhas é o que diz "solta" */
    const pts=ptsDe(cel.pts).map(([x,y])=>[cx+(x-cx)*.93, cy+(y-cy)*.93]);
    const topo=pts.map(([x,y])=>proj(x,y,z));
    topo.forEach(p=>marca(p[0],p[1]));

    let face, faceEsc;
    if(agua){face=P.agua;faceEsc=P.aguaEsc;}
    else if(cel.tipo==="mato"){face=P.mato;faceEsc=P.matoEsc;}
    else if(cel.tipo==="bloqueado"){face=L<0?P.ferro:P.areia;faceEsc=L<0?P.ferroEsc:P.areiaEsc;}
    else if(cel.tipo==="rota"){face=P.rota;faceEsc=P.rotaEsc;}
    else if(cel.tipo==="base0"){face=P.base0;faceEsc=P.base0Esc;}
    else if(cel.tipo==="base1"){face=P.base1;faceEsc=P.base1Esc;}
    else {face=P.areia;faceEsc=P.areiaEsc;}

    /* PAREDE: só as arestas que olham para a câmera, e só até o tampo da
       vizinha daquele lado. */
    for(let i=0;i<6;i++){
      const a=topo[i], b=topo[(i+1)%6];
      if(b[0]-a[0] >= 0) continue;                    /* aresta de trás */
      const escuro = (a[0]>b[0]) ? .34 : .18;
      const p1=ptsDe(cel.pts)[i], p2=ptsDe(cel.pts)[(i+1)%6];
      const viz=vizinhoNaAresta(cel,(p1[0]+p2[0])/2,(p1[1]+p2[1])/2);
      const zv=viz ? (RIO.has(viz.c+","+viz.r)?0:alturaDe(viz)) : -0.5;
      /* teto no degrau: mesmo caindo na água, a parede não vira pilar */
      const fundo=Math.min(2.2, Math.max(0,(z-zv)))*ALT + (viz?2:BASE_ESP);
      if(fundo<1.2) continue;                          /* mesmo nível: sem parede */
      saida+=`<path d="M${n1(a[0])},${n1(a[1])} L${n1(b[0])},${n1(b[1])}
        L${n1(b[0])},${n1(b[1]+fundo)} L${n1(a[0])},${n1(a[1]+fundo)} Z"
        fill="${faceEsc}" stroke="${P.tinta}" stroke-width=".55" stroke-linejoin="round"/>`;
      saida+=`<path d="M${n1(a[0])},${n1(a[1])} L${n1(b[0])},${n1(b[1])}
        L${n1(b[0])},${n1(b[1]+fundo)} L${n1(a[0])},${n1(a[1]+fundo)} Z" fill="#000" opacity="${escuro}"/>`;
      marca(a[0],a[1]+fundo); marca(b[0],b[1]+fundo);
    }
    /* TAMPO */
    const pl=topo.map(p=>n1(p[0])+","+n1(p[1])).join(" ");
    saida+=`<polygon points="${pl}" fill="${face}" stroke="${P.tinta}" stroke-width=".6" stroke-linejoin="round"/>`;
    if(agua){
      saida+=`<polygon points="${pl}" fill="${P.aguaTopo}" opacity=".35"/>`;
      for(let i=0;i<3;i++){const q=rnd(cel.c,cel.r,20+i);
        saida+=`<path d="M${n1(cx-7+q*4)},${n1(cy*ACHATA+ (i-1)*3.4)} q4,-1.6 8,0"
          fill="none" stroke="#DFF3F0" stroke-width=".8" opacity=".55"/>`;}
    }else{
      /* grão do tampo: sem isso a pastilha parece plástico chapado */
      for(let i=0;i<5;i++){const q=rnd(cel.c,cel.r,30+i);
        const px=cx+(rnd(cel.c,cel.r,40+i)-.5)*20, py=cy+(rnd(cel.c,cel.r,50+i)-.5)*20;
        const [sx,sy]=proj(px,py,z);
        saida+=`<ellipse cx="${n1(sx)}" cy="${n1(sy)}" rx="${n1(1+q*2)}" ry="${n1(.5+q*.9)}"
          fill="#000" opacity="${cel.tipo==="mato"?.14:.09}"/>`;}
      /* luz na borda de trás: o degrau só se lê se a quina pegar luz */
      saida+=`<polygon points="${pl}" fill="none" stroke="#FFF" stroke-width=".7" opacity=".16"/>`;
    }

    /* ── O QUE ESTÁ EM CIMA DESTA PEÇA ── */
    const [tx,ty]=proj(cx,cy,z);
    const a1=rnd(cel.c,cel.r,1), b1=rnd(cel.c,cel.r,2), km=Math.floor(rnd(cel.c,cel.r,33)*997);
    const cores=["#4FA3C7","#69AE72","#DE8C9A","#E8C25C","#D2734E","#9B87B8","#EDE4CE"];
    if(agua){ /* água limpa */ }
    else if(cel.tipo==="mato"){
      saida+=arvore(tx-5,ty+2,1.15,km);
      if(a1>.4) saida+=arvore(tx+6,ty-1,.95,km+1);
      if(b1>.65) saida+=arvore(tx+1,ty+5,.8,km+2);
    }else if(cel.tipo==="bloqueado"){
      saida+=(L<0?pilha(tx,ty+1,1.15,km):casinha(tx,ty+1,1.0,km,"#9C8464"));
    }else if(cel.tipo==="rota"){
      if(a1>.86) saida+=pilha(tx+5,ty+2,.6,km);
    }else if(cel.tipo!=="base0"&&cel.tipo!=="base1"&&cel.tipo!=="poco"){
      if(a1>.62){
        if(L>0) saida+=casinha(tx,ty+1,1.0,km,cores[km%cores.length]);
        else     saida+=pilha(tx,ty+1,1.0,km);
      }else if(a1>.5) saida+=arvore(tx+2,ty+1,.85,km);
    }
    /* torre, nexo e alguns bonecos, para a escala aparecer */
    D.torres.forEach(t=>{ if(t.pos[0]===cel.c&&t.pos[1]===cel.r)
      saida+=torreRadio(tx,ty+1,t.t?P.carmim:P.azul); });
    D.bases.forEach((bs,t)=>{ if(bs[0][0]===cel.c&&bs[0][1]===cel.r)
      saida+=nexo(tx,ty+1,t?P.carmim:P.azul); });
    if((cel.c===4&&cel.r===5)||(cel.c===5&&cel.r===5)) saida+=boneco(tx,ty+1,P.azul);
    if((cel.c===6&&cel.r===4)||(cel.c===6&&cel.r===3)) saida+=boneco(tx,ty+1,P.carmim);
  }
}

const M=26;
const vb=`${n1(minX-M)} ${n1(minY-M)} ${n1(maxX-minX+M*2)} ${n1(maxY-minY+M*2)}`;
document.querySelector("#palco").innerHTML=
  `<svg viewBox="${vb}"><defs>
     <radialGradient id="luz" cx="42%" cy="26%" r="78%">
       <stop offset="0" stop-color="#3A342A"/><stop offset="1" stop-color="#15130F"/>
     </radialGradient></defs>
   <rect x="${n1(minX-M)}" y="${n1(minY-M)}" width="${n1(maxX-minX+M*2)}" height="${n1(maxY-minY+M*2)}" fill="url(#luz)"/>
   ${saida}</svg>`;
</script>
