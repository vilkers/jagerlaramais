/* ═══════════ 2D DE CIMA, E POR QUE ISSO É MELHOR AQUI ═══════════
   O isométrico ficava bonito e cobrava caro: o toque na tela deixava de cair na
   casa que o motor conhece, e no celular o tabuleiro encolhia inteiro. De cima,
   a casa está EXATAMENTE onde o motor pensa que ela está — o toque volta a
   funcionar de graça, e o que sobra de trabalho é só arte.

   A densidade toda é DETERMINÍSTICA, semeada por (c,r): o mesmo tabuleiro
   desenha igual sempre. Casa que o jogador decorou não pode mudar de cara. */


/* ═══════════ A REFERÊNCIA E O QUE DELA CABE AQUI ═══════════
   O render que serviu de alvo é uma ilustração de conceito: profundidade,
   textura fotográfica, luz volumétrica. Nada disso existe em SVG escrito à
   mão. O que dela cabe — e é o que importa — é a COMPOSIÇÃO e a PALETA:

     · tabuleiro de areia quente, não creme lavado
     · mato verde-escuro fechado, água turquesa
     · torre = torre de rádio com estais, não selo com número
     · nexo  = base murada com pátio, antena e portão
     · UM LADO É FERRO VELHO, O OUTRO É FAVELA COLORIDA — o rio divide os
       dois mundos, e é isso que dá lado ao tabuleiro sem precisar de legenda

   A divisão de lados sai do próprio traçado do rio (produto vetorial contra a
   reta-base): se o rio mudar, os dois mundos acompanham sozinhos. */

const P = {
  areia:"#C6A97A", areia2:"#BB9D6C", areiaClara:"#D7BE96", areiaEsc:"#A98A5E",
  /* a mesma areia em duas temperaturas: quente do lado da favela, cinzenta e
     encardida do lado do ferro velho. É o chão que dá o lado — etiqueta por
     cima da base só tapava a base. */
  areiaF:"#CCAE79", areiaF2:"#C2A46E", areiaV:"#AD9B7C", areiaV2:"#A2907170".replace("70",""),
  mato:"#55764F",  mato2:"#496845",
  ferro:"#9A7550",  ferro2:"#87643F",
  asfalto:"#8E897E", asfaltoBorda:"#6B665C", faixa:"#D9B547",
  agua:"#3FA7A5",  aguaFundo:"#2C7F80", aguaClara:"#84D2CB", margem:"#D2BB92",
  base0:"#4E80AE", base1:"#A9564C",
  traco:"#5C4E3C", borda:"#4E3E2E", bordaEsc:"#3A2E22",
  tinta:"#2B231A", azul:"#2F76B4", carmim:"#B03A2E", latao:"#D3A93F",
  /* a casa brasileira, do lado azul do rio */
  parede:["#4FA3C7","#69AE72","#DE8C9A","#E8C25C","#D2734E","#9B87B8","#EDE4CE","#E0994A","#67B5A8"],
  telha:["#B0563C","#A85238","#9C4E36","#B75F41"],
  zinco:["#9AA09C","#8C928E","#A6ACA6"],
  /* o ferro velho, do lado carmim */
  ferrugem:["#8E5A3C","#7A4E36","#9C6742","#6E4A34"],
  contentor:["#8C4038","#A07A34","#5E7A48","#7A4E36","#4E7EA0"],
  paredeMoldura:["#8E9BA0","#8A9483","#A98A85","#B49E6C","#A67F62","#8F8593","#9E9683"],
};
function rnd(c,r,k){ let x=(c*374761393+r*668265263+k*1442695040)|0;
  x=(x^(x>>13))*1274126177|0; return ((x^(x>>16))>>>0)/4294967296; }
const ptsDe = s => s.trim().split(/\s+/).map(p=>p.split(",").map(Number));
const cen = (c,r) => D.centro[c+","+r];
const n1 = v => Math.round(v*10)/10;

let fundo="", chao="", agua="", coisas="", fios="", marcas="";

/* ─── O RIO, E A FRONTEIRA ENTRE OS DOIS MUNDOS ─── */
const RA=[-26,64], RB=[430,368];
const RIO = (()=>{
  const N=52, fora=[];
  const vx=RB[0]-RA[0], vy=RB[1]-RA[1], Lr=Math.hypot(vx,vy);
  const px=-vy/Lr, py=vx/Lr;
  for(let i=0;i<=N;i++){ const t=i/N;
    const w = Math.sin(t*Math.PI*2.7)*15 + Math.sin(t*Math.PI*6.9+1.1)*5.5;
    fora.push([RA[0]+vx*t+px*w, RA[1]+vy*t+py*w]);
  }
  return fora;
})();
const dRio = RIO.map((p,i)=>(i?"L":"M")+n1(p[0])+" "+n1(p[1])).join(" ");
/* +1 = margem azul (favela colorida) · -1 = margem carmim (ferro velho) */
const lado = (x,y)=> ((RB[0]-RA[0])*(y-RA[1]) - (RB[1]-RA[1])*(x-RA[0])) > 0 ? 1 : -1;
function pertoDoRio(x,y){
  let m=1e9;
  for(let i=1;i<RIO.length;i++){
    const [ax,ay]=RIO[i-1], [bx,by]=RIO[i];
    const vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy;
    let t=((x-ax)*vx+(y-ay)*vy)/L2; t=Math.max(0,Math.min(1,t));
    m=Math.min(m, Math.hypot(x-(ax+t*vx), y-(ay+t*vy)));
  }
  return m;
}
function cruza(a,b,c,d){
  const rx=b[0]-a[0], ry=b[1]-a[1], sx=d[0]-c[0], sy=d[1]-c[1];
  const den=rx*sy-ry*sx; if(!den) return null;
  const t=((c[0]-a[0])*sy-(c[1]-a[1])*sx)/den;
  const u=((c[0]-a[0])*ry-(c[1]-a[1])*rx)/den;
  if(t<0||t>1||u<0||u>1) return null;
  return [a[0]+t*rx, a[1]+t*ry, Math.atan2(ry,rx)];
}

/* ─── 1 · O CHÃO ─── */
for (const cel of D.cels){
  const pl = ptsDe(cel.pts).map(p=>p.join(",")).join(" ");
  const a = rnd(cel.c,cel.r,1);
  const [cx,cy] = cen(cel.c,cel.r);
  const molh = pertoDoRio(cx,cy), L = lado(cx,cy);
  let f;
  if (cel.tipo==="mato")           f = a>.5 ? P.mato : P.mato2;
  else if (cel.tipo==="bloqueado") f = L<0 ? (a>.5?P.ferro:P.ferro2) : P.areiaEsc;
  else if (cel.tipo==="rota")      f = P.areiaClara;
  else if (cel.tipo==="mato" ) f = f;
  else if (cel.tipo==="poco")      f = P.mato2;
  else if (cel.tipo==="base0")     f = "#B4A17E";
  else if (cel.tipo==="base1")     f = "#B09880";
  else if (L>0) f = a>.55 ? P.areiaF : P.areiaF2;
  else          f = a>.55 ? P.areiaV : P.areiaV2;
  if (molh<12 && cel.tipo!=="rota" && cel.tipo!=="base0" && cel.tipo!=="base1") f = P.margem;
  chao += `<polygon points="${pl}" fill="${f}" stroke="${P.traco}" stroke-width=".5" opacity=".98"/>`;
  for(let i=0;i<3;i++){
    const t=rnd(cel.c,cel.r,10+i);
    if(t<.45) continue;
    chao += `<ellipse cx="${n1(cx+(rnd(cel.c,cel.r,20+i)-.5)*17)}" cy="${n1(cy+(rnd(cel.c,cel.r,30+i)-.5)*17)}"
      rx="${n1(2+t*3)}" ry="${n1(1.4+t*2)}" fill="#00000014"/>`;
  }
}

/* ─── 2 · AS ROTAS: ASFALTO VELHO COM FAIXA AMARELA ───
   Na referência a rota é estrada de verdade, com faixa. Era o que fazia o
   caminho ler como caminho e não como corredor de casa clara. */
const pontes=[];
for (const [nome,lista] of Object.entries(D.rotas)){
  const pts = lista.map(q=>cen(q[0],q[1]));
  const d = pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  chao += `<path d="${d}" fill="none" stroke="${P.asfaltoBorda}" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>`;
  chao += `<path d="${d}" fill="none" stroke="${P.asfalto}" stroke-width="16.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  chao += `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".05" stroke-linejoin="round" stroke-linecap="round"/>`;
  chao += `<path d="${d}" fill="none" stroke="${P.faixa}" stroke-width="1.5" stroke-dasharray="6 7" opacity=".85" stroke-linecap="round"/>`;
  /* remendo e rachadura: asfalto liso é asfalto novo, e aqui nada é novo */
  pts.forEach((p,i)=>{ if(rnd(i,3,41)>.62) return;
    chao += `<ellipse cx="${n1(p[0]+(rnd(i,4,42)-.5)*9)}" cy="${n1(p[1]+(rnd(i,5,43)-.5)*9)}"
      rx="${n1(2.4+rnd(i,6,44)*3)}" ry="${n1(1.8+rnd(i,7,45)*2)}" fill="${P.asfaltoBorda}" opacity=".55"/>`; });
  for(let i=1;i<pts.length;i++) for(let j=1;j<RIO.length;j++){
    const x = cruza(pts[i-1],pts[i],RIO[j-1],RIO[j]);
    if(x && !pontes.some(q=>Math.hypot(q[0]-x[0],q[1]-x[1])<26)) pontes.push(x);
  }
}

/* ─── 3 · A ÁGUA ─── */
agua += `<path d="${dRio}" fill="none" stroke="${P.margem}" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
agua += `<path d="${dRio}" fill="none" stroke="${P.aguaFundo}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
agua += `<path d="${dRio}" fill="none" stroke="${P.agua}" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/>`;
agua += `<path d="${dRio}" fill="none" stroke="${P.aguaClara}" stroke-width="5" opacity=".55" stroke-linecap="round" stroke-linejoin="round"/>`;
agua += `<path d="${dRio}" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".42"
  stroke-dasharray="6 15" stroke-linecap="round" transform="translate(0,-2.6)"/>`;
agua += `<path d="${dRio}" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity=".24"
  stroke-dasharray="3 20" stroke-linecap="round" transform="translate(0,3.2)"/>`;
for(let i=1;i<RIO.length;i++){
  const [ax,ay]=RIO[i-1], [bx,by]=RIO[i];
  const mx=(ax+bx)/2, my=(ay+by)/2, an=Math.atan2(by-ay,bx-ax)+Math.PI/2;
  for(const s of [1,-1]){
    const q=rnd(i,s+2,31);
    const px=mx+Math.cos(an)*s*(9+q*3.5), py=my+Math.sin(an)*s*(9+q*3.5);
    if(q>.55) agua += `<ellipse cx="${n1(px)}" cy="${n1(py)}" rx="${n1(2+q*2)}" ry="${n1(1.6+q*1.5)}"
      fill="${q>.78?"#8A7A5E":"#A08D6C"}"/>`;
    else for(let j=0;j<4;j++) agua += `<line x1="${n1(px+j*1.6-2.4)}" y1="${n1(py+2)}"
      x2="${n1(px+j*1.6-3.4+q*2)}" y2="${n1(py-4-q*2)}" stroke="#3F6440" stroke-width=".85" stroke-linecap="round"/>`;
  }
}

/* ─── 4 · O VOCABULÁRIO DE PEÇAS ─── */
const sombra=(x,y,rx,ry)=>`<ellipse cx="${n1(x+1.6)}" cy="${n1(y+2)}" rx="${n1(rx)}" ry="${n1(ry)}" fill="#00000020"/>`;

const copa = (x,y,e,t)=>{ let o=sombra(x,y,6.4*e,5.6*e); const v=["#4C6E48","#5A7E54","#42623F","#63885B"];
  for(let i=0;i<5;i++){ const an=i*1.257+t, rr=(2.6+rnd(x|0,y|0,40+i)*2.2)*e;
    o+=`<circle cx="${n1(x+Math.cos(an)*3.4*e)}" cy="${n1(y+Math.sin(an)*3.1*e)}" r="${n1(rr)}"
        fill="${v[i%4]}" stroke="#2F4A2E" stroke-width=".45"/>`; }
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(3.4*e)}" fill="#557A4F" stroke="#2F4A2E" stroke-width=".45"/>`;
  return o; };
/* PALMEIRA: a referência é cheia delas, e de cima é a silhueta mais
   reconhecível que existe — roseta de folhas compridas e pontudas. */
const palmeira = (x,y,e,t)=>{ let o=sombra(x,y,6*e,5*e);
  for(let i=0;i<9;i++){ const an=i*.698+t, L=5.6*e;
    o+=`<path d="M${n1(x)},${n1(y)} Q${n1(x+Math.cos(an+.34)*L*.7)},${n1(y+Math.sin(an+.34)*L*.7)}
        ${n1(x+Math.cos(an)*L)},${n1(y+Math.sin(an)*L)}
        Q${n1(x+Math.cos(an-.34)*L*.7)},${n1(y+Math.sin(an-.34)*L*.7)} ${n1(x)},${n1(y)}"
        fill="${i%2?"#4E7248":"#5C8154"}" stroke="#2F4A2E" stroke-width=".35"/>`; }
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1.5*e)}" fill="#3E5C3B"/>`;
  return o; };
/* A CASA PINTADA — margem azul do rio */
const casa = (x,y,e,rot,k,cor)=>{
  const w=11.5*e, h=9.5*e;
  const par = cor || P.parede[k % P.parede.length];
  const pint = (k%7)<4;
  const zin  = !pint && (k%3===0);
  const tel  = pint ? par : (zin ? P.zinco[k%P.zinco.length] : P.telha[k%P.telha.length]);
  let o = `<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">`;
  o += `<rect x="${n1(x-w/2+1.6*e)}" y="${n1(y-h/2+1.9*e)}" width="${n1(w+3*e)}" height="${n1(h+3*e)}" rx="1" fill="#00000022"/>`;
  o += `<rect x="${n1(x-w/2-1.5*e)}" y="${n1(y-h/2-1.5*e)}" width="${n1(w+3*e)}" height="${n1(h+3*e)}" rx="${n1(.8*e)}"
        fill="${par}" stroke="${P.tinta}" stroke-width=".6"/>`;
  o += `<rect x="${n1(x-w/2)}" y="${n1(y-h/2)}" width="${n1(w)}" height="${n1(h)}" fill="${tel}"/>`;
  o += `<rect x="${n1(x-w/2)}" y="${n1(y)}"     width="${n1(w)}" height="${n1(h/2)}" fill="#00000022"/>`;
  for(let i=1;i<5;i++){ const px=x-w/2+i*w/5;
    o += `<line x1="${n1(px)}" y1="${n1(y-h/2)}" x2="${n1(px)}" y2="${n1(y+h/2)}" stroke="${P.tinta}" stroke-width=".3" opacity=".33"/>`; }
  o += `<rect x="${n1(x-w/2)}" y="${n1(y-h/2)}" width="${n1(w)}" height="${n1(h)}" fill="none" stroke="${P.tinta}" stroke-width=".5"/>`;
  o += `<line x1="${n1(x-w/2)}" y1="${n1(y-.5)}" x2="${n1(x+w/2)}" y2="${n1(y-.5)}" stroke="#FFFFFF" stroke-width=".8" opacity=".3"/>`;
  o += `<line x1="${n1(x-w/2)}" y1="${n1(y)}" x2="${n1(x+w/2)}" y2="${n1(y)}" stroke="${P.tinta}" stroke-width=".75"/>`;
  if(k%2===0) o += `<rect x="${n1(x+w/2-4.2*e)}" y="${n1(y-h/2+1*e)}" width="${n1(3.2*e)}" height="${n1(3.2*e)}"
        rx="${n1(.5*e)}" fill="#6FAFC2" stroke="${P.tinta}" stroke-width=".45"/>`;
  o += `</g>`;
  return o;
};
/* O BARRACO DE CHAPA — margem carmim, mesma silhueta, outra alma */
const barraco = (x,y,e,rot,k)=>{
  const w=11*e, h=9*e, cor=P.ferrugem[k%P.ferrugem.length];
  let o=`<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">`;
  o+=`<rect x="${n1(x-w/2+1.5*e)}" y="${n1(y-h/2+1.8*e)}" width="${n1(w+2*e)}" height="${n1(h+2*e)}" fill="#00000022"/>`;
  o+=`<rect x="${n1(x-w/2-1*e)}" y="${n1(y-h/2-1*e)}" width="${n1(w+2*e)}" height="${n1(h+2*e)}"
      fill="${cor}" stroke="${P.tinta}" stroke-width=".6"/>`;
  o+=`<rect x="${n1(x-w/2)}" y="${n1(y-h/2)}" width="${n1(w)}" height="${n1(h)}" fill="${P.zinco[k%3]}"/>`;
  o+=`<rect x="${n1(x-w/2)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h/2)}" fill="#00000026"/>`;
  for(let i=1;i<6;i++) o+=`<line x1="${n1(x-w/2+i*w/6)}" y1="${n1(y-h/2)}" x2="${n1(x-w/2+i*w/6)}" y2="${n1(y+h/2)}"
      stroke="${P.tinta}" stroke-width=".35" opacity=".4"/>`;
  o+=`<rect x="${n1(x-w/2)}" y="${n1(y-h/2)}" width="${n1(w)}" height="${n1(h)}" fill="none" stroke="${P.tinta}" stroke-width=".5"/>`;
  o+=`</g>`;
  return o;
};
const carro = (x,y,e,cor,rot)=>`<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">
  <rect x="${n1(x-3*e+1.4)}" y="${n1(y-6*e+1.6)}" width="${n1(6*e)}" height="${n1(12*e)}" rx="${n1(1.6*e)}" fill="#00000022"/>
  <rect x="${n1(x-3*e)}" y="${n1(y-6*e)}" width="${n1(6*e)}" height="${n1(12*e)}" rx="${n1(1.6*e)}" fill="${cor}"
        stroke="${P.tinta}" stroke-width=".55"/>
  <rect x="${n1(x-2.2*e)}" y="${n1(y-3.4*e)}" width="${n1(4.4*e)}" height="${n1(4*e)}" rx="${n1(.8*e)}" fill="#1F2320" opacity=".55"/>
  <rect x="${n1(x-2.2*e)}" y="${n1(y+3*e)}" width="${n1(4.4*e)}" height="${n1(2*e)}" rx="${n1(.5*e)}" fill="#1F2320" opacity=".35"/>
  </g>`;
const sucata = (x,y,e,s)=>{ let o="";
  for(let i=0;i<7;i++){ const q=rnd(x|0,y|0,50+i+s), w=(1.6+q*3)*e, h=(1.2+q*2.4)*e;
    o+=`<rect x="${n1(x+(rnd(x|0,y|0,60+i)-.5)*13*e)}" y="${n1(y+(rnd(x|0,y|0,70+i)-.5)*13*e)}"
        width="${n1(w)}" height="${n1(h)}" transform="rotate(${n1(q*90)} ${n1(x)} ${n1(y)})"
        fill="${q>.5?"#8A6A48":"#70543A"}" stroke="${P.tinta}" stroke-width=".35"/>`; }
  return o; };
const pneu = (x,y,e)=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.6*e)}" fill="none" stroke="#2E2A24" stroke-width="${n1(1.5*e)}"/>`;
const tambor = (x,y,e,cor)=>`${sombra(x,y,3*e,2.8*e)}
  <circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(2.8*e)}" fill="${cor}" stroke="${P.tinta}" stroke-width=".55"/>
  <circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(1.7*e)}" fill="none" stroke="${P.tinta}" stroke-width=".4" opacity=".6"/>`;
/* CONTENTOR: a cor do ferro velho não é só ferrugem, é contêiner pintado */
const contentor = (x,y,e,rot,k)=>{ const cor=P.contentor[k%P.contentor.length];
  let o=`<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">
    <rect x="${n1(x-8*e+1.4)}" y="${n1(y-4.4*e+1.6)}" width="${n1(16*e)}" height="${n1(8.8*e)}" fill="#00000022"/>
    <rect x="${n1(x-8*e)}" y="${n1(y-4.4*e)}" width="${n1(16*e)}" height="${n1(8.8*e)}" fill="${cor}"
      stroke="${P.tinta}" stroke-width=".6"/>`;
  for(let i=1;i<8;i++) o+=`<line x1="${n1(x-8*e+i*2*e)}" y1="${n1(y-4.4*e)}" x2="${n1(x-8*e+i*2*e)}" y2="${n1(y+4.4*e)}"
    stroke="${P.tinta}" stroke-width=".3" opacity=".4"/>`;
  o+=`<rect x="${n1(x-8*e)}" y="${n1(y+1.4*e)}" width="${n1(16*e)}" height="${n1(3*e)}" fill="#00000022"/></g>`;
  return o; };
/* GUINDASTE: braço e contrapeso girando sobre a base. De cima é a peça mais
   legível de um ferro velho — diz "aqui se desmonta coisa grande". */
const guindaste = (x,y,e,ang)=>`<g transform="rotate(${n1(ang)} ${n1(x)} ${n1(y)})">
  ${sombra(x,y,5*e,4.6*e)}
  <rect x="${n1(x-1.5*e)}" y="${n1(y-15*e)}" width="${n1(3*e)}" height="${n1(15*e)}" fill="#9A7A44" stroke="${P.tinta}" stroke-width=".5"/>
  <path d="M${n1(x-1.5*e)},${n1(y-15*e)} L${n1(x+1.5*e)},${n1(y-11*e)} M${n1(x+1.5*e)},${n1(y-15*e)} L${n1(x-1.5*e)},${n1(y-11*e)}
        M${n1(x-1.5*e)},${n1(y-11*e)} L${n1(x+1.5*e)},${n1(y-7*e)} M${n1(x+1.5*e)},${n1(y-11*e)} L${n1(x-1.5*e)},${n1(y-7*e)}"
        stroke="${P.tinta}" stroke-width=".45" fill="none"/>
  <rect x="${n1(x-2.6*e)}" y="${n1(y)}" width="${n1(5.2*e)}" height="${n1(5*e)}" rx="${n1(.6*e)}" fill="#7A5E3A" stroke="${P.tinta}" stroke-width=".55"/>
  <circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(3.4*e)}" fill="#A8853F" stroke="${P.tinta}" stroke-width=".6"/>
  <circle cx="${n1(x)}" cy="${n1(y-14*e)}" r="${n1(1.8*e)}" fill="none" stroke="${P.tinta}" stroke-width=".7"/>
  </g>`;
/* VARAL e CAMPO DE VÁRZEA: dois carimbos de Brasil que nenhum render genérico
   tem, e que valem mais que qualquer textura. */
const varal = (x,y,e,k)=>{ let o=`<line x1="${n1(x-6*e)}" y1="${n1(y)}" x2="${n1(x+6*e)}" y2="${n1(y+1*e)}"
    stroke="${P.tinta}" stroke-width=".5"/>`;
  for(let i=0;i<4;i++) o+=`<rect x="${n1(x-5*e+i*3.2*e)}" y="${n1(y-.4)}" width="${n1(2.2*e)}" height="${n1(3*e)}"
    rx=".4" fill="${P.parede[(k+i)%P.parede.length]}" stroke="${P.tinta}" stroke-width=".3"/>`;
  return o; };
const varzea = (x,y,rot)=>`<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">
  <rect x="${n1(x-13)}" y="${n1(y-8.5)}" width="26" height="17" rx="1" fill="#B79A66" stroke="#7E6034" stroke-width=".7"/>
  <rect x="${n1(x-13)}" y="${n1(y-8.5)}" width="26" height="17" fill="none" stroke="#E8DCBC" stroke-width=".7" stroke-dasharray="2.4 2"/>
  <line x1="${n1(x)}" y1="${n1(y-8.5)}" x2="${n1(x)}" y2="${n1(y+8.5)}" stroke="#E8DCBC" stroke-width=".6"/>
  <circle cx="${n1(x)}" cy="${n1(y)}" r="3.6" fill="none" stroke="#E8DCBC" stroke-width=".6"/>
  <rect x="${n1(x-13.6)}" y="${n1(y-3)}" width="1.4" height="6" fill="#E8DCBC" stroke="${P.tinta}" stroke-width=".35"/>
  <rect x="${n1(x+12.2)}" y="${n1(y-3)}" width="1.4" height="6" fill="#E8DCBC" stroke="${P.tinta}" stroke-width=".35"/>
  <circle cx="${n1(x+4)}" cy="${n1(y+3)}" r="1.1" fill="#F2ECDC" stroke="${P.tinta}" stroke-width=".3"/>
  </g>`;
const igreja = (x,y,e,rot)=>`<g transform="rotate(${n1(rot)} ${n1(x)} ${n1(y)})">
  ${sombra(x,y,8*e,6*e)}
  <rect x="${n1(x-6*e)}" y="${n1(y-5*e)}" width="${n1(12*e)}" height="${n1(10*e)}" fill="#EDE4CE" stroke="${P.tinta}" stroke-width=".6"/>
  <rect x="${n1(x-6*e)}" y="${n1(y-5*e)}" width="${n1(12*e)}" height="${n1(5*e)}" fill="#B0563C"/>
  <rect x="${n1(x-6*e)}" y="${n1(y)}" width="${n1(12*e)}" height="${n1(5*e)}" fill="#9C4E36"/>
  <line x1="${n1(x-6*e)}" y1="${n1(y)}" x2="${n1(x+6*e)}" y2="${n1(y)}" stroke="${P.tinta}" stroke-width=".6"/>
  <rect x="${n1(x-2*e)}" y="${n1(y-9*e)}" width="${n1(4*e)}" height="${n1(4*e)}" fill="#EDE4CE" stroke="${P.tinta}" stroke-width=".55"/>
  <path d="M${n1(x)},${n1(y-13*e)} v${n1(3.4*e)} M${n1(x-1.3*e)},${n1(y-11.8*e)} h${n1(2.6*e)}"
    stroke="${P.tinta}" stroke-width="${n1(.8*e)}" stroke-linecap="round"/>
  </g>`;

/* ─── 5 · POVOAR: DOIS MUNDOS, UM DE CADA MARGEM ─── */
const ancoras=[];                       /* onde tem casa, para pendurar fio */
let feitoVarzea=false, feitaIgreja=false;
for (const cel of D.cels){
  const [cx,cy] = cen(cel.c,cel.r);
  const a=rnd(cel.c,cel.r,1), b=rnd(cel.c,cel.r,2), c3=rnd(cel.c,cel.r,3);
  const k=(cel.c*7+cel.r*3);
  const j=(kk,m)=>(rnd(cel.c,cel.r,kk)-.5)*(m||16);
  const molh = pertoDoRio(cx,cy), L = lado(cx,cy);
  if (cel.tipo==="base0" || cel.tipo==="base1") continue;
  if (molh < 10) continue;
  if (cel.tipo==="mato"){
    coisas += copa(cx+j(4,13), cy+j(5,13), 1.35+a*.5, a*6);
    coisas += (b>.5 ? palmeira(cx+j(6,19), cy+j(7,19), 1.2, b*6)
                    : copa(cx+j(6,19), cy+j(7,19), 1.1+b*.45, b*6));
    coisas += copa(cx+j(8,21), cy+j(9,21), .95+c3*.4, c3*6);
    if (a>.4)  coisas += palmeira(cx+j(12,22), cy+j(13,22), .85, a*9);
    if (b>.55) coisas += copa(cx+j(14,20), cy+j(15,20), .75, b*9);
  } else if (cel.tipo==="bloqueado"){
    if (L<0){                             /* FERRO VELHO */
      coisas += sucata(cx,cy,1.3,0);
      coisas += contentor(cx+j(4,9), cy+j(5,9), .8, j(11,50), k);
      if (a>.5) coisas += guindaste(cx+j(6,10), cy+j(7,10), .8, j(12,60));
      else      coisas += carro(cx+j(6,12), cy+j(7,12), 1.1, "#8C4038", a*180);
      coisas += tambor(cx+j(14,20), cy+j(15,20), .9, "#A07A34");
      coisas += pneu(cx+j(16,19), cy+j(17,19), 1.05);
    } else {                              /* BECO FECHADO DA FAVELA */
      for(let q=0;q<4;q++){ const an=q*1.7+a*6, raio=q?5.4+rnd(cel.c,cel.r,84+q)*2.8:0;
        const px=cx+Math.cos(an)*raio+j(44+q,3), py=cy+Math.sin(an)*raio*.85+j(54+q,3);
        coisas += (q%2 ? barraco(px,py,.85,(rnd(cel.c,cel.r,74+q)-.5)*80,k+q)
                       : casa(px,py,.8+rnd(cel.c,cel.r,64+q)*.35,(rnd(cel.c,cel.r,74+q)-.5)*80,k+q*3));
        ancoras.push([px,py]); }
      coisas += pneu(cx+j(16,19), cy+j(17,19), .9);
    }
  } else if (cel.tipo==="rota"){
    if (a>.66) coisas += carro(cx+j(4,22), cy+j(5,22), .72, L<0?"#7A5E3A":"#8C7A5E", a*180);
    if (b>.72) coisas += pneu(cx+j(6,23), cy+j(7,23), .9);
    if (c3>.82) coisas += sucata(cx+j(8,22), cy+j(9,22), .55, 5);
  } else if (cel.tipo==="poco"){
    coisas += copa(cx, cy, 1.3, 2); coisas += palmeira(cx+j(6,18), cy+j(7,18), 1.0, 1);
  } else if (L>0){
    /* ═ MARGEM AZUL — A FAVELA COLORIDA ═ */
    if (!feitoVarzea && a>.62 && molh>22){ coisas += varzea(cx,cy,j(11,26)); feitoVarzea=true; }
    else if (!feitaIgreja && a>.5 && b>.5){
      coisas += igreja(cx+j(4,8), cy+j(5,8), 1.0, j(11,16)); feitaIgreja=true;
      coisas += casa(cx+j(14,17), cy+j(15,17), .8, j(16,40), k+5);
    } else {
      /* AGLOMERADO: três a quatro casas encostadas, tamanhos diferentes,
         telhados em ângulos diferentes. É a densidade que faz o lugar. */
      const quantas = 3 + (b>.55?1:0);
      for(let q=0;q<quantas;q++){
        const an = q*1.9 + a*6, raio = q?5+rnd(cel.c,cel.r,80+q)*3.4:0;
        const px = cx+Math.cos(an)*raio + j(40+q,4), py = cy+Math.sin(an)*raio*.85 + j(50+q,4);
        coisas += casa(px, py, .78+rnd(cel.c,cel.r,60+q)*.5, (rnd(cel.c,cel.r,70+q)-.5)*80, k+q*3);
        ancoras.push([px,py]);
      }
      if (a>.62) coisas += palmeira(cx+j(8,24), cy+j(9,24), 1.0, a*6);
      if (b>.48) coisas += varal(cx+j(16,22), cy+j(17,22), .9, k);
      if (c3>.66) coisas += carro(cx+j(22,24), cy+j(23,24), .8, c3>.82?"#69AE72":"#D2734E", c3*180);
      else if (c3>.42) coisas += pneu(cx+j(22,24), cy+j(23,24), .85);
    }
  } else {
    /* ═ MARGEM CARMIM — O FERRO VELHO ═ */
    /* PÁTIO DE DESMANCHE: chão de sucata primeiro, peça grande em cima,
       tambores e pneus por último. Um objeto por casa era estacionamento. */
    coisas += sucata(cx+j(30,10), cy+j(31,10), 1.15, 3);
    if (a>.62)      coisas += contentor(cx+j(4,11), cy+j(5,11), .72+b*.22, j(11,50), k);
    else if (a>.42) coisas += barraco(cx+j(4,11), cy+j(5,11), 1.0, j(11,34), k);
    else if (a>.24) coisas += guindaste(cx+j(4,10), cy+j(5,10), .8, j(12,60));
    else            coisas += carro(cx+j(4,13), cy+j(5,13), 1.05, c3>.5?"#7A4E36":"#8A6A38", a*180);
    if (b>.58)      coisas += carro(cx+j(16,21), cy+j(17,21), .85, b>.8?"#8C4038":"#6E543A", b*180);
    else if (b>.34) coisas += contentor(cx+j(16,20), cy+j(17,20), .55, j(18,50), k+3);
    else            coisas += copa(cx+j(16,21), cy+j(17,21), .8, b*7);
    coisas += tambor(cx+j(24,22), cy+j(25,22), .85, c3>.5?"#A07A34":"#8C4038");
    if (c3>.5) coisas += tambor(cx+j(26,20), cy+j(27,20), .8, "#7A4E36");
    coisas += pneu(cx+j(22,24), cy+j(23,24), .9);
    if (a>.5) coisas += pneu(cx+j(28,23), cy+j(29,23), .8);
  }
}
/* GAMBIARRA: fio de luz pendurado de casa em casa. É a palavra do universo
   virando desenho, e só existe na margem da favela. */
for(let i=0;i<ancoras.length;i++){
  let melhor=null, dd=1e9;
  for(let m=i+1;m<ancoras.length;m++){
    const d=Math.hypot(ancoras[i][0]-ancoras[m][0], ancoras[i][1]-ancoras[m][1]);
    if(d<dd && d>14){ dd=d; melhor=ancoras[m]; }
  }
  if(!melhor || dd>40) continue;
  const [x1,y1]=ancoras[i], [x2,y2]=melhor;
  const mx=(x1+x2)/2, my=(y1+y2)/2+dd*.16;
  fios += `<path d="M${n1(x1)},${n1(y1)} Q${n1(mx)},${n1(my)} ${n1(x2)},${n1(y2)}"
    fill="none" stroke="${P.tinta}" stroke-width=".55" opacity=".7"/>`;
  fios += `<circle cx="${n1(mx)}" cy="${n1(my-.6)}" r="1" fill="${P.latao}" stroke="${P.tinta}" stroke-width=".3"/>`;
}

/* ─── 6 · AS PONTES ─── */
for(const [px,py,ang] of pontes){
  coisas += `<g transform="rotate(${n1(ang*180/Math.PI)} ${n1(px)} ${n1(py)})">
    <rect x="${n1(px-13)}" y="${n1(py-9.5)}" width="26" height="19" fill="#A98A5C" stroke="${P.tinta}" stroke-width=".6"/>`;
  for(let i=-2;i<=2;i++) coisas += `<line x1="${n1(px+i*4.4)}" y1="${n1(py-9.5)}" x2="${n1(px+i*4.4)}" y2="${n1(py+9.5)}"
      stroke="${P.tinta}" stroke-width=".45" opacity=".5"/>`;
  coisas += `<rect x="${n1(px-13)}" y="${n1(py-11.2)}" width="26" height="2.2" fill="#5C4630"/>
    <rect x="${n1(px-13)}" y="${n1(py+9)}" width="26" height="2.2" fill="#5C4630"/>
    <path d="M${n1(px-11)},${n1(py-10.4)} q5.5,-3.4 11,0 q5.5,3.4 10,-.8" fill="none" stroke="${P.tinta}" stroke-width=".6" opacity=".8"/>
    </g>`;
}

/* ─── 7 · A MOLDURA: FERRO VELHO DE UM LADO, FAVELA DO OUTRO ─── */
const vb = D.viewBox.split(" ").map(Number);
const X0=vb[0], Y0=vb[1], L=vb[2], A=vb[3], M=34;
fundo += `<rect x="${X0-M}" y="${Y0-M}" width="${L+M*2}" height="${A+M*2}" rx="8" fill="${P.borda}"/>`;
fundo += `<rect x="${X0-M+3}" y="${Y0-M+3}" width="${L+M*2-6}" height="${A+M*2-6}" rx="6" fill="none"
  stroke="${P.bordaEsc}" stroke-width="2.5"/>`;
/* a moldura é MOLDURA: rebaixada, senão ela grita mais alto que o tabuleiro */
fundo += `<g opacity=".8">`;
for(let i=0;i<64;i++){
  const t=i/64, q=rnd(i,7,3);
  const lados = [[X0-M+8+t*(L+M*2-16), Y0-M+9],[X0-M+8+t*(L+M*2-16), Y0+A+M-9],
                 [X0-M+11, Y0-M+10+t*(A+M*2-20)],[X0+L+M-11, Y0-M+10+t*(A+M*2-20)]];
  lados.forEach(([bx,by],n)=>{
    const dx=(rnd(i,3+n,11)-.5)*9, dy=(rnd(i,4+n,12)-.5)*9, e2=.55+rnd(i,5+n,13)*.5;
    const favela = lado(bx,by)>0;
    if(favela){
      if(q<.34) fundo += casa(bx+dx,by+dy,e2*1.05,(rnd(i,6+n,14)-.5)*70,i+n,P.paredeMoldura[(i+n)%P.paredeMoldura.length]);
      else if(q<.68) fundo += barraco(bx+dx,by+dy,e2,(rnd(i,6+n,14)-.5)*70,i+n);
      else if(q<.82) fundo += palmeira(bx+dx,by+dy,e2*1.1,q*6);
      else fundo += varal(bx+dx,by+dy,e2,i+n);
    } else {
      if(q<.16) fundo += contentor(bx+dx,by+dy,e2*.68,(rnd(i,6+n,14)-.5)*70,i+n);
      else if(q<.54) fundo += sucata(bx+dx,by+dy,e2,i+n);
      else if(q<.68) fundo += pneu(bx+dx,by+dy,e2*1.3);
      else if(q<.82) fundo += carro(bx+dx,by+dy,e2*.8,"#6E543A",rnd(i,7+n,15)*180);
      else fundo += tambor(bx+dx,by+dy,e2,"#8A6A38");
    }
  });
}
fundo += `</g>`;
const placas=[["FÉ EM SUCATA",   X0+L*.40,Y0-M+15,-3,P.latao],
              ["FERRO VELHO",    X0+L*.87,Y0-M+15, 4,"#B4543F"],
              ["FAVELA",         X0+L*.16,Y0+A+M-15,-2,P.azul],
              ["DEUS É GAMBIARRA",X0-M+18,Y0+A*.62,-90,P.latao],
              ["CUIDADO! KABUM!", X0+L+M-18,Y0+A*.55,90,"#B4543F"]];
for(const [txt,px,py,rot,cor] of placas)
  fundo += `<g transform="rotate(${rot} ${px} ${py})">
    <rect x="${px-26}" y="${py-6}" width="52" height="13" rx="1.5" fill="${cor}" stroke="${P.tinta}" stroke-width=".7"/>
    <text x="${px}" y="${py+3.4}" font-size="6.4" text-anchor="middle" font-family="Estencil,sans-serif"
     fill="#241F17">${txt}</text></g>`;

/* ─── 8 · TORRE DE RÁDIO, BASE E ACAMPAMENTO ───
   Da referência: a torre é ANTENA, e o nexo é BASE MURADA. Um selo com número
   não diz de quem é nem para onde aponta; a antena com estais e bandeira diz
   as duas coisas sem uma linha de legenda. */
function torreRadio(x,y,cor,ang){
  let o=sombra(x,y,13,12);
  /* laje e estais: a marca registrada da torre de rádio vista de cima */
  o+=`<rect x="${n1(x-11.5)}" y="${n1(y-11.5)}" width="23" height="23" rx="2.5"
      fill="#B49A6E" stroke="${P.tinta}" stroke-width=".7"/>`;
  o+=`<rect x="${n1(x-8.6)}" y="${n1(y-8.6)}" width="17.2" height="17.2" rx="1.5"
      fill="none" stroke="${P.tinta}" stroke-width=".45" stroke-dasharray="2.4 3"/>`;
  for(let i=0;i<3;i++){ const an=i*2.094-Math.PI/2;
    o+=`<line x1="${n1(x)}" y1="${n1(y)}" x2="${n1(x+Math.cos(an)*12)}" y2="${n1(y+Math.sin(an)*12)}"
        stroke="${P.tinta}" stroke-width=".7" opacity=".8"/>`;
    o+=`<rect x="${n1(x+Math.cos(an)*12-1.5)}" y="${n1(y+Math.sin(an)*12-1.5)}" width="3" height="3"
        fill="#8A7048" stroke="${P.tinta}" stroke-width=".5"/>`; }
  /* mastro treliçado */
  o+=`<g transform="rotate(45 ${n1(x)} ${n1(y)})">
      <rect x="${n1(x-5.6)}" y="${n1(y-5.6)}" width="11.2" height="11.2" fill="#A88A56" stroke="${P.tinta}" stroke-width=".65"/>
      <path d="M${n1(x-5.6)},${n1(y-5.6)} L${n1(x+5.6)},${n1(y+5.6)} M${n1(x+5.6)},${n1(y-5.6)} L${n1(x-5.6)},${n1(y+5.6)}"
        stroke="${P.tinta}" stroke-width=".5"/></g>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="4.6" fill="${cor}" stroke="${P.tinta}" stroke-width=".8"/>`;
  o+=`<path d="M${n1(x-3.2)},${n1(y-3.2)} a4.6,4.6 0 0 1 6.4,0" fill="none" stroke="#FFF" stroke-width="1" opacity=".45"/>`;
  /* prato apontando para o lado do inimigo */
  o+=`<g transform="rotate(${n1(ang*180/Math.PI)} ${n1(x)} ${n1(y)})">
      <line x1="${n1(x+4)}" y1="${n1(y)}" x2="${n1(x+9.5)}" y2="${n1(y)}" stroke="${P.tinta}" stroke-width="1.3"/>
      <path d="M${n1(x+9.5)},${n1(y-4.4)} a4.6,4.6 0 0 1 0,8.8 z" fill="#D9CDAE" stroke="${P.tinta}" stroke-width=".7"/></g>`;
  /* bandeira do time */
  o+=`<path d="M${n1(x-9)},${n1(y-9)} l0,-7.5 l6.4,2.8 l-6.4,2.8" fill="${cor}" stroke="${P.tinta}" stroke-width=".55"/>`;
  return o;
}
function baseNexo(x,y,cor,claro){
  let o=`<circle cx="${n1(x)}" cy="${n1(y)}" r="30" fill="${cor}" opacity=".10"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="22" fill="${cor}" opacity=".12"/>`;
  /* MURO DE PERÍMETRO com portão: o que faz ler "base" e não "praça" */
  const arco=`M${n1(x+19)},${n1(y+4)} a19,19 0 1 1 ${n1(-6)},${n1(-18)}`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="19" fill="#B9A277" stroke="${P.tinta}" stroke-width=".7"/>`;
  o+=`<path d="${arco}" fill="none" stroke="${P.tinta}" stroke-width="4.4" stroke-linecap="round"/>`;
  o+=`<path d="${arco}" fill="none" stroke="#8E7A52" stroke-width="3" stroke-linecap="round"/>`;
  o+=`<path d="${arco}" fill="none" stroke="${P.tinta}" stroke-width=".55" stroke-dasharray="3 3.4"/>`;
  o+=`<path d="M${n1(x+13)},${n1(y-14)} l${n1(6)},${n1(18)}" stroke="${P.latao}" stroke-width="2.2" stroke-linecap="round"/>`;
  /* pátio: dois galpões, tambores e o gerador */
  o+=`<rect x="${n1(x-14)}" y="${n1(y+3)}" width="12" height="7.5" fill="${claro}" stroke="${P.tinta}" stroke-width=".6"/>`;
  o+=`<rect x="${n1(x-14)}" y="${n1(y+6.7)}" width="12" height="3.8" fill="#00000026"/>`;
  o+=`<rect x="${n1(x+1.5)}" y="${n1(y-13.5)}" width="11" height="7" fill="${claro}" stroke="${P.tinta}" stroke-width=".6"/>`;
  o+=`<rect x="${n1(x+1.5)}" y="${n1(y-10)}" width="11" height="3.5" fill="#00000026"/>`;
  for(let i=0;i<3;i++) o+=tambor(x-13+i*4.4, y-9, .62, "#A07A34");
  /* torre central: mastro, luz e antena — o coração da base */
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="9.4" fill="#A88A56" stroke="${P.tinta}" stroke-width=".75"/>`;
  o+=`<g transform="rotate(45 ${n1(x)} ${n1(y)})">
      <path d="M${n1(x-6.6)},${n1(y-6.6)} L${n1(x+6.6)},${n1(y+6.6)} M${n1(x+6.6)},${n1(y-6.6)} L${n1(x-6.6)},${n1(y+6.6)}"
        stroke="${P.tinta}" stroke-width=".55" opacity=".8"/></g>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="6" fill="${cor}" stroke="${P.tinta}" stroke-width=".9"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-.6)}" r="3.2" fill="#F5EED6"/>`;
  o+=`<circle cx="${n1(x)}" cy="${n1(y-.6)}" r="1.4" fill="${cor}"/>`;
  for(let i=0;i<4;i++){ const a=i*Math.PI/2+.78;
    o+=`<line x1="${n1(x+Math.cos(a)*7)}" y1="${n1(y+Math.sin(a)*7)}" x2="${n1(x+Math.cos(a)*10.4)}" y2="${n1(y+Math.sin(a)*10.4)}"
        stroke="${P.latao}" stroke-width="1.5" stroke-linecap="round"/>`; }
  o+=`<path d="M${n1(x-2.6)},${n1(y-8.6)} L${n1(x-9)},${n1(y-19)}" stroke="${P.tinta}" stroke-width="1.5" stroke-linecap="round"/>`;
  o+=`<path d="M${n1(x-9)},${n1(y-19)} l-3.2,4.2 M${n1(x-9)},${n1(y-19)} l4.2,2.8 M${n1(x-9)},${n1(y-19)} l-.6,-4"
      stroke="${P.tinta}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  o+=`<path d="M${n1(x-9)},${n1(y-19)} L${n1(x-14.5)},${n1(y-7)} M${n1(x-9)},${n1(y-19)} L${n1(x+1.5)},${n1(y-9.5)}"
      stroke="${P.tinta}" stroke-width=".5" opacity=".6"/>`;
  return o;
}
function tocaG(x,y,neutro){
  let o=`<circle cx="${n1(x)}" cy="${n1(y)}" r="11" fill="#00000014"/>`;
  const arco=`M${n1(x+11)},${n1(y)} a11,11 0 1 1 ${n1(-4.4)},${n1(-10.1)}`;
  o+=`<path d="${arco}" fill="none" stroke="${P.tinta}" stroke-width="4.6" stroke-linecap="round"/>`;
  o+=`<path d="${arco}" fill="none" stroke="#A88A5C" stroke-width="3.2" stroke-linecap="round"/>`;
  o+=`<path d="${arco}" fill="none" stroke="${P.tinta}" stroke-width=".6" stroke-dasharray="3.2 3.2"/>`;
  o+=`<path d="M${n1(x+6.6)},${n1(y-8.8)} l${n1(4.4)},${n1(8.8)}" stroke="${P.latao}" stroke-width="2.2" stroke-linecap="round"/>`;
  if(neutro){
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      o+=`<circle cx="${n1(x+Math.cos(a)*5.4)}" cy="${n1(y+Math.sin(a)*5.4)}" r="1.7" fill="#8A7A5C" stroke="${P.tinta}" stroke-width=".4"/>`; }
    o+=`<path d="M${n1(x)},${n1(y-7)} q4.6,4 2.2,7.4 q-2.2,3.2 -2.2,4 q0,-.8 -2.2,-4 q-2.4,-3.4 2.2,-7.4"
        fill="${P.latao}" stroke="${P.tinta}" stroke-width=".6"/>`;
    o+=`<path d="M${n1(x)},${n1(y-2.6)} q2,2 .9,3.6 q-.9,1.4 -.9,1.8 q0,-.4 -.9,-1.8 q-1.1,-1.6 .9,-3.6" fill="#F0E3B4"/>`;
    o+=`<text x="${n1(x)}" y="${n1(y+18)}" font-size="6" text-anchor="middle" font-family="Estencil,sans-serif"
        fill="#EDE7D6">NEUTRO</text>`;
  } else {
    o+=`<path d="M${n1(x-5)},${n1(y+3.4)} l5,-7.6 l5,7.6 z" fill="#7E6A4A" stroke="${P.tinta}" stroke-width=".6"/>`;
    o+=`<path d="M${n1(x-2.4)},${n1(y+3.4)} l2.4,-3.6 l2.4,3.6 z" fill="${P.tinta}" opacity=".55"/>`;
    o+=`<circle cx="${n1(x)}" cy="${n1(y-6.4)}" r="1.8" fill="${P.latao}" stroke="${P.tinta}" stroke-width=".45"/>`;
  }
  return o;
}

for (const t of D.torres){
  const [x,y] = cen(t.pos[0],t.pos[1]);
  const lista = D.rotas[t.rota];
  const eu = lista.findIndex(q=>q[0]===t.pos[0]&&q[1]===t.pos[1]);
  const alvo = lista[Math.min(lista.length-1, Math.max(0, eu + (t.t?-2:2)))];
  const [ax,ay] = cen(alvo[0],alvo[1]);
  marcas += torreRadio(x, y, t.t?P.carmim:P.azul, Math.atan2(ay-y, ax-x));
}
for (const k of D.camps){ const [x,y]=cen(k.pos[0],k.pos[1]); marcas += tocaG(x,y,k.neutro); }
D.bases.forEach((bs,t)=>{
  const [x,y]=cen(bs[0][0],bs[0][1]);
  const [qx,qy]=cen(bs[1][0],bs[1][1]);
  const cor = t?P.carmim:P.azul, claro = t?"#C7A29C":"#A8BDD2";
  /* a base é um COMPLEXO, não um prédio: o pátio murado numa casa e o
     hangar com pista de pouso na outra */
  marcas += `<circle cx="${n1(qx)}" cy="${n1(qy)}" r="15" fill="${cor}" opacity=".10"/>`;
  marcas += `<rect x="${n1(qx-13)}" y="${n1(qy-9)}" width="26" height="18" rx="1.5"
    fill="#B9A277" stroke="${P.tinta}" stroke-width=".7"/>`;
  marcas += `<rect x="${n1(qx-10)}" y="${n1(qy-6.5)}" width="20" height="13" fill="${claro}" stroke="${P.tinta}" stroke-width=".55"/>`;
  marcas += `<rect x="${n1(qx-10)}" y="${n1(qy)}" width="20" height="6.5" fill="#00000026"/>`;
  for(let i=1;i<6;i++) marcas += `<line x1="${n1(qx-10+i*20/6)}" y1="${n1(qy-6.5)}" x2="${n1(qx-10+i*20/6)}" y2="${n1(qy+6.5)}"
    stroke="${P.tinta}" stroke-width=".35" opacity=".45"/>`;
  marcas += `<line x1="${n1(qx-10)}" y1="${n1(qy)}" x2="${n1(qx+10)}" y2="${n1(qy)}" stroke="${P.tinta}" stroke-width=".7"/>`;
  marcas += tambor(qx-9.5, qy+12, .75, "#A07A34") + tambor(qx-4.5, qy+12.5, .75, "#8C4038");
  marcas += `<path d="M${n1(qx+6)},${n1(qy+11)} h9 M${n1(qx+6)},${n1(qy+13.5)} h9"
    stroke="${cor}" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>`;
  marcas += baseNexo(x,y, cor, claro);
});
Object.entries(D.rotas).forEach(([nome,l])=>{ const meio=l[Math.floor(l.length/2)];
  const [x,y]=cen(meio[0],meio[1]);
  marcas += `<rect x="${x-25}" y="${y-8.5}" width="50" height="16" rx="3" fill="${P.tinta}" opacity=".9"/>
    <rect x="${x-25}" y="${y-8.5}" width="50" height="16" rx="3" fill="none" stroke="${P.latao}" stroke-width=".7" opacity=".75"/>
    <text x="${x}" y="${y+2.8}" font-size="7.4" text-anchor="middle" letter-spacing="2"
     font-family="Estencil,sans-serif" fill="#EDE7D6">${nome.toUpperCase()}</text>`; });

let malha="";
for (const cel of D.cels){
  const pl = ptsDe(cel.pts).map(p=>p.join(",")).join(" ");
  malha += `<polygon points="${pl}" fill="none" stroke="${P.tinta}" stroke-width=".7" opacity=".26"/>`;
  malha += `<polygon points="${pl}" fill="none" stroke="#FFFFFF" stroke-width=".5" opacity=".13"
    transform="translate(0,-.7)"/>`;
}
document.querySelector("#palco").innerHTML =
  `<svg viewBox="${X0-M} ${Y0-M} ${L+M*2} ${A+M*2}">${fundo}${chao}${agua}${coisas}${fios}${malha}${marcas}</svg>`;
</script>
